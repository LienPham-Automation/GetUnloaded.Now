/* Cream + ink carry the product. Coral means "this needs your attention".
   Apricot and pink support only. Sorted things lose their colour on purpose.
   --coral is the brand fill (3.1:1 on cream, so never small text).
   --coral-ink is the text-safe coral (4.8:1). */
:root{
  --page:#F2E7D9;
  --bg:#FFF8F1; --surface:#FFFDFA; --raise:#FBF2E9;
  --ink:#302B33; --muted:#736C77; --faint:#8B8390;
  --line:#EADFD3; --line-soft:#F4EAE0;
  --coral:#EF604F; --coral-ink:#C93A2B; --coral-wash:#FDEDEA;
  --apricot:#F4C59D; --apricot-wash:#FDF2E6;
  --pink:#E9A8B2; --pink-wash:#FBEDEF;
  --on-color:#241A1C;
  --band:#302B33; --on-band:#FFF8F1;
  --shadow:0 1px 2px rgba(48,43,51,.05), 0 18px 44px rgba(48,43,51,.10);
  --sheet-shadow:0 -8px 60px rgba(48,43,51,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#120F13;
    --bg:#1B171C; --surface:#252029; --raise:#2C2630;
    --ink:#F5EDE4; --muted:#A79FAC; --faint:#867E8B;
    --line:#3A3340; --line-soft:#2F2935;
    --coral:#EF604F; --coral-ink:#FF8776; --coral-wash:#3A1F1B;
    --apricot:#DFAF83; --apricot-wash:#372A1D;
    --pink:#D98F9C; --pink-wash:#341F24;
    --on-color:#241A1C;
    --band:#0D0B0E; --on-band:#F5EDE4;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.42);
    --sheet-shadow:0 -8px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --page:#120F13;
  --bg:#1B171C; --surface:#252029; --raise:#2C2630;
  --ink:#F5EDE4; --muted:#A79FAC; --faint:#867E8B;
  --line:#3A3340; --line-soft:#2F2935;
  --coral:#EF604F; --coral-ink:#FF8776; --coral-wash:#3A1F1B;
  --apricot:#DFAF83; --apricot-wash:#372A1D;
  --pink:#D98F9C; --pink-wash:#341F24;
  --on-color:#241A1C;
  --band:#0D0B0E; --on-band:#F5EDE4;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.42);
  --sheet-shadow:0 -8px 60px rgba(0,0,0,.6);
}

/* ==========================================================================
   BASE
   ========================================================================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2.5px solid var(--coral-ink);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.disp{
  font-family:'Bricolage Grotesque',Georgia,serif;font-weight:800;
  text-transform:uppercase;letter-spacing:-.034em;line-height:.9;text-wrap:balance;
}
.d1{font-size:40px}
.d2{font-size:32px}
.d3{font-size:25px}
.lab{
  font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
}
.sub{color:var(--muted);font-size:15px;line-height:1.5}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ==========================================================================
   APP SHELL
   ========================================================================== */
.app{
  max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--bg);position:relative;
  box-shadow:0 0 0 1px var(--line);
}
@media(min-width:560px){.app{box-shadow:0 0 0 1px var(--line), 0 30px 90px rgba(53,47,59,.13)}}
.screen{display:none;padding:0 22px calc(124px + env(safe-area-inset-bottom));animation:fade .22s ease}
.screen.on{display:block}
.screen.flush{padding-left:0;padding-right:0}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{padding:calc(24px + env(safe-area-inset-top)) 0 0}
.pad{padding-left:22px;padding-right:22px}

/* ---- nav ---- */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;z-index:40;
  background:var(--bg);border-top:1.5px solid var(--line);
  padding:9px 6px calc(9px + env(safe-area-inset-bottom));
  display:flex;align-items:flex-end;justify-content:space-around;gap:2px;
  transition:opacity .3s;
}
.nav.hush{opacity:.4}
/* display:flex above outranks the UA rule for [hidden], so say it explicitly.
   Without this the nav shows during onboarding and setup can be skipped. */
.nav[hidden]{display:none}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);padding:5px 2px;line-height:1.2;text-align:center;min-height:52px;
  justify-content:flex-end;
}
.nav button .ic{width:21px;height:21px;display:block}
.nav button .ic svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink)}
.nav .plus{flex:0 0 78px}
.nav .plus .fab{
  width:54px;height:54px;border-radius:17px;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;margin-bottom:2px;
  box-shadow:0 6px 18px rgba(53,47,59,.28);transition:transform .12s;
}
.nav .plus:active .fab{transform:scale(.93)}
.nav .plus .fab svg{
  width:24px;height:24px;display:block;
  fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;
}

/* ==========================================================================
   PRIMITIVES
   ========================================================================== */
.btn{
  display:block;width:100%;text-align:center;
  background:var(--ink);color:var(--bg);
  font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:18px 20px;border-radius:3px;transition:transform .1s,opacity .15s;
}
.btn:active{transform:scale(.985)}
/* Disabled reads as an empty outline, not a heavy grey slab. */
.btn[disabled]{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1.5px var(--line);cursor:default}
.inp::placeholder,textarea.inp::placeholder{color:var(--faint);opacity:1}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.coral{background:var(--coral);color:var(--on-color)}
.btn.sm{padding:13px 16px;font-size:12.5px}
.btn-row{display:flex;gap:9px}
.btn-row .btn{flex:1}
.txtbtn{
  font-size:13.5px;font-weight:700;color:var(--coral-ink);letter-spacing:.02em;
  padding:11px 0;display:inline-block;
}
.txtbtn.mut{color:var(--muted)}

.rule{height:1.5px;background:var(--line);border:0;margin:0}
.gap{height:34px}
.gap-s{height:20px}
.gap-l{height:56px}

/* ---- definition rows (Today, day blocks) ---- */
.dl{border-top:1.5px solid var(--line)}
.dl .r{
  display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:baseline;
  padding:14px 0;border-bottom:1px solid var(--line-soft);
}
.dl .r:last-child{border-bottom:0}
.dl .r dt{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.dl .r dd{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.dl .r dd small{display:block;font-size:13.5px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:1px}
.dl.tight .r{padding:11px 0}
.dl.tight .r dd{font-size:15.5px}

/* ---- section head ---- */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}

/* ---- chips ---- */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -22px;padding:0 22px 4px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{
  font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:100px;
  box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);white-space:nowrap;scroll-snap-align:start;
  transition:background .13s,color .13s,box-shadow .13s;
}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}

/* ---- pills / states ---- */
.state{
  font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  padding:4px 9px;border-radius:100px;white-space:nowrap;
}
/* Deliberately inverted: a scenario with no plan is the one that gets colour.
   Sorted goes quiet, because sorted is meant to stop asking for you. */
.state.sorted{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.state.open{background:var(--coral);color:var(--on-color);box-shadow:none}

/* ---- fields ---- */
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:7px}
.inp,.sel{
  width:100%;background:var(--surface);color:var(--ink);
  border:1.5px solid var(--line);border-radius:3px;padding:14px 15px;
  font-size:16px;font-weight:500;
}
.inp:focus,.sel:focus{border-color:var(--coral-ink);outline:none}
textarea.inp{resize:none;line-height:1.45}
.sel{
  appearance:none;-webkit-appearance:none;padding-right:40px;font-weight:600;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 20px) calc(50% + 1px),calc(100% - 14px) calc(50% + 1px);
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;
}

/* ---- toggle list ---- */
.tlist{border-top:1.5px solid var(--line)}
.tlist button{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:15px 0;border-bottom:1px solid var(--line-soft);
}
.tlist .box{
  width:22px;height:22px;flex:none;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line);
  display:grid;place-items:center;transition:background .13s,box-shadow .13s;
}
.tlist .box svg{width:13px;height:13px;stroke:var(--bg);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tlist button[aria-pressed="true"] .box{background:var(--ink);box-shadow:none}
.tlist button[aria-pressed="true"] .box svg{opacity:1}
.tlist button[aria-pressed="true"] .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.tlist .t{font-size:16px;font-weight:600;flex:1}

/* ==========================================================================
   OWNERSHIP
   ========================================================================== */
.catlab{
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  padding:26px 0 9px;
}
.resp{
  display:block;width:100%;text-align:left;padding:15px 0 16px;
  border-top:1.5px solid var(--line);position:relative;
}
.resp:last-of-type{border-bottom:1.5px solid var(--line)}
.resp.mine{padding-left:13px}
.resp.mine::before{
  content:"";position:absolute;left:0;top:15px;bottom:16px;width:3px;background:var(--coral);border-radius:2px;
}
.resp .rt{font-size:16.5px;font-weight:700;letter-spacing:-.012em;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.resp .rt .warn{
  font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--coral-ink);box-shadow:inset 0 0 0 1.5px var(--coral);padding:3px 7px;border-radius:100px;
}
.triad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
.triad .c{padding-right:10px;border-right:1px solid var(--line-soft)}
.triad .c:last-child{border-right:0;padding-right:0}
.triad .cl{
  font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  display:flex;align-items:center;gap:5px;margin-bottom:5px;
}
.triad .dot{width:13px;height:13px;border-radius:3px;display:grid;place-items:center;
  font-size:8px;font-weight:700;color:var(--on-color);flex:none;line-height:1}
.triad .dot.out{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.2px currentColor}
.triad .cv{font-size:14.5px;font-weight:600;color:var(--muted)}
.triad .c.lead .cv{color:var(--ink);font-weight:700}
.triad .cv.none{color:var(--faint);font-weight:500}

/* ==========================================================================
   BANDS / TAKEOVER
   ========================================================================== */
.band{background:var(--band);color:var(--on-band);padding:34px 22px;margin:0 -22px}
.band.coral{background:var(--coral);color:var(--on-color)}
.chaos-hero{padding-top:calc(40px + env(safe-area-inset-top));padding-bottom:38px;margin-bottom:4px}
.band .lab{color:inherit;opacity:.62}
.band .sub{color:inherit;opacity:.8}

.takeover{
  position:fixed;inset:0;z-index:70;background:var(--band);color:var(--on-band);
  display:none;flex-direction:column;overflow-y:auto;
  padding:calc(40px + env(safe-area-inset-top)) 26px calc(34px + env(safe-area-inset-bottom));
  animation:tkin .3s cubic-bezier(.2,.7,.3,1);
}
.takeover.on{display:flex}
.takeover.coral{background:var(--coral);color:var(--on-color)}
.takeover.quiet{background:var(--bg);color:var(--ink)}
/* The reveal is ink, with the numbers doing the shouting. Full coral is held
   back for When Shit Hits The Fan so the two moments stay distinct. */
.takeover.reveal .bignum{color:var(--coral)}
@keyframes tkin{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
.takeover .mid{margin:auto 0}
.takeover .lab{color:inherit;opacity:.6}
.takeover .sub{color:inherit;opacity:.82}
.bignum{
  font-family:'Bricolage Grotesque',Georgia,serif;font-weight:800;
  font-size:84px;line-height:.84;letter-spacing:-.045em;font-variant-numeric:tabular-nums;
}
.takeover .btn{background:var(--on-band);color:var(--band)}
.takeover.coral .btn{background:var(--on-color);color:var(--coral)}
.takeover.quiet .btn{background:var(--ink);color:var(--bg)}
.takeover .txtbtn{color:inherit;opacity:.7}

/* ==========================================================================
   SHEET
   ========================================================================== */
.scrim{
  position:fixed;inset:0;z-index:50;background:rgba(28,20,32,.5);
  opacity:0;pointer-events:none;transition:opacity .24s;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;transform:translate(-50%,100%);bottom:0;
  width:100%;max-width:520px;z-index:60;
  background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--sheet-shadow);
  max-height:94vh;max-height:94dvh;overflow-y:auto;
  padding:12px 22px calc(26px + env(safe-area-inset-bottom));
  transition:transform .3s cubic-bezier(.2,.8,.25,1);
}
.sheet.on{transform:translate(-50%,0)}
.grab{width:38px;height:4px;border-radius:100px;background:var(--line);margin:0 auto 20px}
.sheet-x{position:absolute;top:16px;right:18px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.sheet-x svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}

/* ==========================================================================
   SPECIFIC
   ========================================================================== */
.float{
  width:100%;text-align:left;padding:15px 0;
  border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;
}
.float:first-of-type{border-top:1.5px solid var(--line)}
.float .fd{width:7px;height:7px;border-radius:100px;background:var(--coral);flex:none}
.float .ft{flex:1;font-size:16px;font-weight:600;letter-spacing:-.01em}
.float .fa{color:var(--faint);font-size:18px;line-height:1}

/* Section 2. The only part of Today allowed to raise its voice. */
.needs{
  background:var(--coral-wash);border-radius:4px;padding:24px 22px;margin:0 -22px;
  border-top:2.5px solid var(--coral);
}
.needs .float:first-of-type{border-top-color:rgba(201,58,43,.28)}
.needs .float{border-bottom-color:rgba(201,58,43,.18)}
.needs .btn.coral{margin-top:4px}

/* Section 3. An observation, in plain sentences. Not a metric. */
.carryline{font-size:17px;line-height:1.45;letter-spacing:-.01em}
.carryline b{
  font-family:'Bricolage Grotesque',Georgia,serif;font-weight:800;
  font-size:23px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
}
.carryline.mut{color:var(--muted);margin-top:4px}

/* Section 4. Only exceptions, only ahead. */
.up{display:grid;grid-template-columns:50px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.up:last-child{border-bottom:0}
.up .ud{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.up .uv{font-size:16px;font-weight:600;letter-spacing:-.01em}
.up .uv small{display:block;font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.up.open .uv small{color:var(--coral-ink);font-weight:600}

/* ---- voice capture ---- */
.mic{
  display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  background:var(--coral);color:var(--on-color);border-radius:4px;
  padding:22px 20px;font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  transition:transform .1s;
}
button.mic:active{transform:scale(.985)}
.mic .mi{width:24px;height:24px;flex:none}
.mic .mi svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mic.listening{background:var(--ink);color:var(--bg)}
.mic .pulse{
  width:13px;height:13px;border-radius:100px;background:var(--coral);flex:none;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.72)}}
@media (prefers-reduced-motion:reduce){.mic .pulse{animation:none}}
.notice{
  margin:calc(14px + env(safe-area-inset-top)) 0 0;
  background:var(--apricot-wash);border-radius:3px;padding:13px 15px;
  font-size:13.5px;line-height:1.45;color:var(--ink);font-weight:500;
}
.micerr{
  margin-top:11px;font-size:14px;line-height:1.45;color:var(--ink);font-weight:500;
  background:var(--apricot-wash);border-radius:3px;padding:12px 14px;
}

.dump{
  display:flex;gap:12px;align-items:flex-start;padding:14px 0;
  border-bottom:1px solid var(--line-soft);
}
.dump .dt{flex:1;font-size:16px;font-weight:500;line-height:1.4}
.dump .dw{font-size:11px;color:var(--faint);font-weight:600;white-space:nowrap;padding-top:3px}

.day{padding:22px 0;border-top:1.5px solid var(--line)}
.day.today{margin:0 -22px;padding:22px;background:var(--raise);border-top-color:var(--ink)}
.day .dh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:13px}
.day .dn{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:800;font-size:21px;letter-spacing:-.025em;text-transform:uppercase}
.day .dd{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.day{cursor:pointer}
.day .edit{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--coral-ink);opacity:0;transition:opacity .15s;margin-left:4px;
}
.day:hover .edit,.day:focus-visible .edit{opacity:1}
@media (hover:none){.day .edit{opacity:.75}}
.who{display:grid;gap:5px;margin-bottom:13px}
.who .w{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:baseline;font-size:15px}
.who .w b{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.who .w span{font-weight:600}
.who .w span small{color:var(--muted);font-weight:500;font-size:13px}
.logi{display:flex;gap:0;border-top:1px solid var(--line-soft);padding-top:11px}
.logi .l{flex:1;border-right:1px solid var(--line-soft);padding-right:8px}
.logi .l:last-child{border-right:0}
.logi .ll{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.logi .lv{font-size:14px;font-weight:600}
.logi .lv.chg{color:var(--coral-ink)}

.chg-list{background:var(--apricot-wash);border-radius:4px;padding:18px 20px}
.chg-list .ci{display:flex;gap:10px;padding:7px 0;font-size:15px;font-weight:600;align-items:baseline}
.chg-list .ci .cd{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);min-width:34px}

.scen{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:17px 0;border-top:1.5px solid var(--line);
}
.scen:last-of-type{border-bottom:1.5px solid var(--line)}
.scen .st{flex:1;font-size:16.5px;font-weight:700;letter-spacing:-.012em}
.scen .st small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}

.qa{padding:20px 0;border-bottom:1px solid var(--line-soft)}
.qa .q{font-size:16px;font-weight:700;margin-bottom:11px;letter-spacing:-.01em}
.people{display:flex;gap:7px;flex-wrap:wrap}
.pbtn{
  display:flex;align-items:center;gap:8px;padding:9px 14px 9px 9px;border-radius:100px;
  box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;font-weight:600;color:var(--muted);
  transition:background .13s,color .13s,box-shadow .13s;
}
.pbtn .av{
  width:24px;height:24px;border-radius:100px;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--on-color);flex:none;
}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}

/* ---- share card ---- */
.card{
  background:var(--surface);border:1.5px solid var(--line);border-radius:4px;
  padding:28px 24px;box-shadow:var(--shadow);
}
.card .ch{border-bottom:2.5px solid var(--ink);padding-bottom:14px;margin-bottom:6px}
.card .srow{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.card .srow .sd{font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.card .srow .sv{font-size:15px;font-weight:600;line-height:1.45}
.card .srow .sv em{font-style:normal;color:var(--muted);font-weight:500}
.card .sblock{margin-top:24px}
.card .sblock .bt{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  border-bottom:1.5px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.card .sblock .bi{padding:9px 0;font-size:15px;font-weight:600;border-bottom:1px solid var(--line-soft)}
.card .sblock .bi:last-child{border-bottom:0}
.card .cf{margin-top:26px;padding-top:16px;border-top:1.5px solid var(--line);font-size:12px;color:var(--faint);font-weight:600}

/* ---- onboarding ---- */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(30px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom))}
.ob .obtop{display:flex;align-items:center;gap:12px;margin-bottom:30px;min-height:24px}
.ob .prog{flex:1;display:flex;gap:4px}
.ob .prog i{flex:1;height:3px;border-radius:100px;background:var(--line)}
.ob .prog i.on{background:var(--ink)}
.wordmark{
  font-family:'Bricolage Grotesque',Georgia,serif;font-weight:800;
  font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--coral-ink);
}
.ob .obmid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 0 26px}
.ob .obfoot{display:flex;flex-direction:column;gap:4px}
.daygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.daygrid button{
  padding:13px 2px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line);
  font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
}
.daygrid button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}

      return function stop(){
        if(stopped) return; stopped = true;
        try{ rec.stop(); }catch(err){}
      };
    }
  };
})();

/* The single place a brain dump is created. If we ever add "Sort this for me",
   it slots in here, after the dump is already safely saved. */
function commitDump(text, source){
  var clean = String(text || "").trim();
  if(!clean) return null;
  var d = { id:uid(), text:clean, ago:"just now", source:source || "typed" };
  S.dumps.unshift(d); save();
  return d;
}

/* ---- role dot ---- */

/* ==========================================================================

   ========================================================================== */
var current = "today";
function go(name, opts){
  /* In pre-return mode, Today is the countdown. Redirect once, here, not mid-render. */
  if(name === "today" && stage() === "prep") name = "return";
  current = name;
  var ids = ["onboard","today","week","owns","chaos","return","reset","share","more"];
  ids.forEach(function(i){ var el = $("s-" + i); if(el) el.classList.toggle("on", i === name); });
  var nav = $("nav");
  nav.hidden = (name === "onboard");
  var lit = (name === "return" && stage() === "prep") ? "today" : name;
  Array.prototype.forEach.call(nav.querySelectorAll("[data-go]"), function(b){
    b.classList.toggle("on", b.getAttribute("data-go") === lit);
  });
  nav.classList.toggle("hush", name === "today" && isQuietToday());
  var r = {
    today: renderToday, week: renderWeek, owns: renderOwns, chaos: renderChaos,
    "return": renderReturn, reset: renderReset, share: renderShare, more: renderMore,
    onboard: function(){ renderOb(1); }
  }[name];
  if(r) r(opts);
  if(name !== "onboard" && location.hash !== "#/" + name){
    try{ history.replaceState(null, "", "#/" + name); }catch(e){}
  }
  window.scrollTo(0,0);
  var app = $("app"); if(app) app.scrollTop = 0;
}
function screenFromHash(){
  var m = /^#\/(today|week|owns|chaos|return|reset|share|more)$/.exec(location.hash || "");
  return m ? m[1] : null;
}

function toast(msg){
  var el = $("toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("on"); }, 2400);
}

/* ==========================================================================
   SCREEN: TODAY
   ========================================================================== */
function renderToday(){
  var el = $("s-today");
  var k = todayKey(), d = now(), r = routine()[k], isWeekend = !r;
  var un = unresolved(), soon = comingUp();
  /* The quiet state: nothing waiting on a decision, nothing ahead worth
     flagging. Today's operating view stays, then the screen ends. */
  var quiet = isQuietToday();

  /* ---- 1. WHAT IS HAPPENING TODAY ---- */
  var head = (stage() === "first")
    ? '<h1 class="disp d1">' + nl(t("today.firstWeek", { day: DAYNAMES[d.getDay()] })) + '</h1>'
    : '<h1 class="disp d2">' + esc(t("today.greet")) + ', ' + esc(pfull("me")) + '.</h1>';

  var todayBlock;
  if(isWeekend){
    todayBlock = '<p class="sub">No childcare, no work pattern today. Enjoy the chaos of your own making.</p>';
  } else {
    var pickId = r.pick, note = "";
    var exc = S.exc.filter(function(e){ return e.day === k; })[0];
    if(exc && exc.person){ pickId = exc.person; note = " (changed)"; }
    todayBlock =
      '<dl class="dl">' +
        (r.work.me ? row("You", r.work.me[0], r.work.me[1]) : "") +
        (r.care ? row(childName(), r.care[0], r.care[1]) : "") +
        row("Drop-off", pname(r.drop), "") +
        row("Pickup", pname(pickId) + note, "") +
      '</dl>';
  }

  /* ---- 2. WHAT ISN'T SORTED  (coral: this is the attention state) ---- */
  var needs = "";
  if(un.length && !quiet){
    needs =
      '<div class="gap"></div>' +
      '<section class="needs">' +
        '<h2 class="disp d3">' + un.length + ' thing' + (un.length > 1 ? "s" : "") +
          '<br>still floating<br>around</h2>' +
        '<div class="gap-s" style="height:16px"></div>' +
        un.map(function(u){
          return '<button class="float" data-un="' + esc(u.go) + '" data-scen="' + esc(u.scen||"") +
            '" data-pin="' + esc(u.pin||"") + '">' +
            '<span class="fd" aria-hidden="true"></span><span class="ft">' + esc(u.t) + '</span>' +
            '<span class="fa" aria-hidden="true">' + (u.pin ? "&times;" : "&rsaquo;") + '</span></button>';
        }).join("") +
        '<div class="gap-s"></div>' +
        '<button class="btn coral" data-un="' + esc(un[0].go) + '">' + esc(t("today.floatCta")) + ' &rarr;</button>' +
      '</section>';
  }

  /* ---- 3. WHAT IS STILL RELYING ON MY BRAIN  (observation, not a metric) ---- */
  var carry = "";
  if(!quiet && stage() !== "first"){
    carry =
      '<div class="gap"></div><hr class="rule">' +
      '<div style="padding-top:22px">' +
        '<h2 class="disp d3">Still in<br>your head</h2>' +
        '<div class="gap-s" style="height:14px"></div>' +
        '<p class="carryline"><b>' + onMe().length + '</b> things still rely on you remembering them.</p>' +
        '<p class="carryline mut"><b>' + doneByOthers().length + '</b> are being done by someone else.</p>' +
        '<div class="gap-s" style="height:14px"></div>' +
        '<button class="txtbtn" data-go2="owns">' + esc(t("today.carryCta")) + ' &rarr;</button>' +
      '</div>';
  }

  /* ---- 4. WHAT'S COMING THAT ACTUALLY NEEDS ATTENTION ---- */
  var coming = "";
  if(soon.length && !quiet){
    coming =
      '<div class="gap"></div><hr class="rule">' +
      '<div style="padding-top:22px">' +
        '<p class="lab">Coming up</p>' +
        '<div class="gap-s" style="height:12px"></div>' +
        soon.map(function(e){
          var dn = DAYS.filter(function(x){ return x.k === e.day; })[0];
          return '<div class="up' + (e.needsCover ? " open" : "") + '">' +
            '<span class="ud">' + esc(dn ? dn.n.slice(0,3) : "") + '</span>' +
            '<span class="uv">' + esc(e.label) +
              (e.note ? '<small>' + esc(e.note) + '</small>' : '') + '</span></div>';
        }).join("") +
      '</div>';
  }

  /* ---- the ending ---- */
  var ending = "";
  if(quiet){
    ending =
      '<div class="gap-l"></div>' +
      '<h2 class="disp d1">' + nl(t("quiet.title")) + '</h2>' +
      '<div class="gap-s" style="height:14px"></div>' +
      '<p class="sub" style="font-size:17px">' + esc(t("quiet.sub")) + '</p>';
  } else if(!S.resetDone && stage() !== "first"){
    ending =
      '<div class="gap"></div><hr class="rule">' +
      '<div style="padding-top:22px">' +
        '<p class="lab">Sunday</p>' +
        '<div class="gap-s" style="height:8px"></div>' +
        '<h2 class="disp d3">Sort my week</h2>' +
        '<div class="gap-s" style="height:8px"></div>' +
        '<p class="sub">Ten minutes. Get next week out of your head.</p>' +
        '<div class="gap-s"></div>' +
        '<button class="btn ghost" data-go2="reset">Start</button>' +
      '</div>';
  }

  var storageNote = STORAGE_OK ? "" :
    '<p class="notice">Nothing will save here. This browser blocks storage for files ' +
    'opened straight off the phone. Everything works, it just resets when you close it.</p>';

  el.innerHTML =
    storageNote +
    '<div class="top"><p class="lab">' + esc(DAYNAMES[d.getDay()]) + ' ' + esc(shortDate(d)) + '</p></div>' +
    '<div class="gap-s" style="height:12px"></div>' + head +
    '<div class="gap"></div>' +
    (isWeekend ? "" : '<p class="lab">Today</p><div class="gap-s" style="height:10px"></div>') +
    todayBlock + needs + carry + coming + ending;

  function row(label, value, small){
    return '<div class="r"><dt>' + esc(label) + '</dt><dd>' + esc(value) +
      (small ? '<small>' + esc(small) + '</small>' : '') + '</dd></div>';
  }
}

/* ==========================================================================
   SCREEN: OUT OF MY HEAD
   ========================================================================== */
function openCapture(){
  var fromVoice = false, stopFn = null;

  openSheet(
    '<div id="capBody">' +
      '<h2 class="disp d2">' + nl(t("cap.title")) + '</h2>' +
      '<div class="gap-s" style="height:10px"></div>' +
      '<p class="sub">' + esc(t("cap.help")) + '</p>' +
      '<div class="gap-s"></div>' +
      (SPEECH.supported ?
        '<div id="capVoice"></div>' +
        '<p class="lab" id="capOr" style="text-align:center;margin:16px 0 10px">' + esc(t("cap.orType")) + '</p>'
        : '') +
      '<textarea class="inp" id="capIn" rows="3"' + (SPEECH.supported ? '' : ' data-autofocus') +
        ' placeholder="' +
        esc(stage() === "prep" ? "what happens if the baby is sick on day one" : "need a bigger daycare sleep sack") +
        '" enterkeyhint="done" aria-label="What is on your mind"></textarea>' +
      '<div class="gap-s" style="height:14px"></div>' +
      '<button class="btn" id="capGo" disabled>' + esc(t("cap.cta")) + ' &rarr;</button>' +
      (S.dumps.length ? '<div class="gap"></div><p class="lab">The pile (' + S.dumps.length + ')</p>' +
        '<div class="gap-s" style="height:6px"></div>' +
        S.dumps.slice(0,3).map(function(d){
          return '<div class="dump"><span class="dt">' + esc(d.text) + '</span><span class="dw">' + esc(d.ago) + '</span></div>';
        }).join("") +
        '<button class="txtbtn mut" id="capPile">See all ' + S.dumps.length + ' &rarr;</button>' : "") +
    '</div>'
  );

  var ta = $("capIn"), btn = $("capGo");
  if(SPEECH.supported) drawMic();

  ta.addEventListener("input", function(){ sync(); });
  ta.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); if(ta.value.trim()) submit(); }
  });
  btn.onclick = submit;
  var pile = $("capPile"); if(pile) pile.onclick = openPile;

  function sync(){
    btn.disabled = !ta.value.trim();
    btn.innerHTML = fromVoice ? esc(t("cap.save")) : esc(t("cap.cta")) + " &rarr;";
  }

  /* ---- voice states ---- */
  function drawMic(msg){
    $("capVoice").innerHTML =
      '<button class="mic" id="micGo">' +
        '<span class="mi"><svg viewBox="0 0 24 24" aria-hidden="true">' +
          '<rect x="9" y="2.5" width="6" height="11" rx="3"/>' +
          '<path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span>' +
        esc(t("cap.say")) +
      '</button>' +
      (msg ? '<p class="micerr" role="status">' + esc(msg) + '</p>' : '');
    $("micGo").onclick = listen;
  }

  function drawListening(){
    $("capVoice").innerHTML =
      '<div class="mic listening">' +
        '<span class="pulse" aria-hidden="true"></span>' +
        '<span class="ml">' + esc(t("cap.listening")) + '</span>' +
      '</div>' +
      '<p class="sub" id="capLive" role="status" aria-live="polite" ' +
        'style="min-height:44px;margin-top:12px;font-size:16px;color:var(--ink);font-weight:500">' +
        esc(t("cap.listenHint")) + '</p>' +
      '<div class="gap-s" style="height:10px"></div>' +
      '<button class="btn ghost sm" id="micStop">' + esc(t("cap.stop")) + '</button>';
    $("micStop").onclick = function(){ if(stopFn) stopFn(); };
  }

  function listen(){
    drawListening();
    var live = $("capLive");
    stopFn = SPEECH.start({
      onPartial: function(txt){
        if(!live || !live.isConnected) return;
        live.textContent = txt || t("cap.listenHint");
      },
      onFinal: function(txt){
        if(!txt) return;
        fromVoice = true;
        ta.value = (ta.value.trim() ? ta.value.trim() + " " : "") + txt;
      },
      onError: function(msg){
        stopFn = null;
        if($("capVoice")){ drawMic(msg); sync(); }
      },
      onEnd: function(){
        stopFn = null;
        if(!$("capVoice")) return;
        drawMic();
        sync();
        if(fromVoice && ta.value.trim()){
          var or = $("capOr");
          if(or) or.textContent = t("cap.heard");
          ta.focus();
          ta.setSelectionRange(ta.value.length, ta.value.length);
        }
      }
    });
  }

  function submit(){
    if(stopFn) stopFn();
    var text = ta.value.trim(); if(!text) return;
    commitDump(text, fromVoice ? "voice" : "typed");
    $("capBody").innerHTML =
      '<div style="padding:22px 0 6px">' +
        '<h2 class="disp d1">' + esc(t("cap.done")) + '</h2>' +
        '<div class="gap-s" style="height:12px"></div>' +
        '<p class="sub" style="font-size:17px;max-width:26ch">' + esc(t("cap.doneSub")) + '</p>' +
        '<div class="gap-s"></div>' +
        '<div style="background:var(--raise);border-radius:4px;padding:15px 17px;font-size:15.5px;font-weight:600">' +
          esc(text) + '</div>' +
        '<div class="gap"></div>' +
        '<button class="btn" id="capMore">+ ' + esc(t("cap.again")) + '</button>' +
        '<div class="gap-s" style="height:10px"></div>' +
        '<div class="btn-row">' +
          '<button class="btn ghost sm" id="capSort">' + esc(t("cap.later")) + '</button>' +
          '<button class="btn ghost sm" id="capDone">Done</button>' +
        '</div>' +
      '</div>';
    $("capMore").onclick = openCapture;
    $("capDone").onclick = function(){ closeSheet(); if(current === "today") renderToday(); };
    $("capSort").onclick = openPile;
  }
}

function openPile(){
  openSheet(

    '<p class="sub">Captured, not sorted. That is allowed. Turn something into a real thing whenever you feel like it.</p>' +
    '<div class="gap-s"></div>' +

    }).join("") + '</div>' : '<p class="sub">Nothing in the pile.</p>')

/* Manual classification only. Nothing here reads the text or guesses. */
function sortDump(id){
  var d = S.dumps.filter(function(x){ return x.id === id; })[0]; if(!d) return;
  var opts = [
    { k:"week",   t:"This week" },
    { k:"owns",   t:"Who owns this?" },
    { k:"return", t:"Return prep" },
    { k:"chaos",  t:"Backup plan" },
    { k:"pin",    t:"Reminder" },
    { k:"stay",   t:"Leave it here" }
  ];
  openSheet(
    '<p class="lab">Sort this</p><div class="gap-s" style="height:10px"></div>' +
    '<h2 class="disp d3">' + esc(d.text) + '</h2>' +
    '<div class="gap-s"></div>' +
    '<div class="optlist" id="sortOpts">' + opts.map(function(o){
      return '<button data-k="' + o.k + '"><span class="rd"><i></i></span>' + esc(o.t) + '</button>';
    }).join("") + '</div>' +
    '<div class="gap-s"></div>' +
    '<button class="txtbtn mut" id="sortBin">Bin it</button>'
  );
  Array.prototype.forEach.call($("sortOpts").querySelectorAll("button"), function(b){
    b.onclick = function(){ apply(b.getAttribute("data-k")); };
  });
  $("sortBin").onclick = function(){ apply("bin"); };

  function apply(k){
    if(k === "stay"){ closeSheet(); return; }
    /* Reminder keeps it in the pile but surfaces it on Today, so the option
       means something without needing notifications. */
    if(k === "pin"){
      d.pinned = true; save(); closeSheet();
      toast("Pinned to Today.");
      if(current === "today") renderToday();
      return;
    }
    S.dumps = S.dumps.filter(function(x){ return x.id !== id; });
    if(k === "owns"){
      S.resp.push(R("r" + uid(), d.text.charAt(0).toUpperCase() + d.text.slice(1), "Daycare", "me", "me", null));
    }
    if(k === "return"){ S.retTasks.push({ id:uid(), t:d.text, cat:"Childcare", done:false }); }
    if(k === "week"){ S.weekNotes = (S.weekNotes || []).concat([{ id:uid(), t:d.text }]); }
    save(); closeSheet();
    toast(k === "bin" ? "Gone." : "Moved out of the pile.");
    if(current === "today") renderToday(); else go(current);
  }
}

/* ==========================================================================
   SCREEN: WHO OWNS THIS
   ========================================================================== */

    '<p class="sub" style="max-width:30ch">' + esc(t("owns.sub")) + '</p>' +
    obs +

  Array.prototype.forEach.call($("ownsChips").querySelectorAll(".chip"), function(b){

function respRow(r){

function openResp(id){
  var r = S.resp.filter(function(x){ return x.id === id; })[0]; if(!r) return;
  openSheet(
    '<p class="lab">' + esc(r.cat) + '</p><div class="gap-s" style="height:10px"></div>' +
    '<h2 class="disp d2">' + esc(r.title) + '</h2>' +
    '<div class="gap-s"></div>' +
    ['remember','do','backup'].map(function(role){
      var key = role === "do" ? "doer" : role;
      var rr = BRAND.roles[role];
      return '<div class="qa"><div class="q">' + dot(role) + ' ' + esc(rr.label) +
        '<span style="font-weight:500;color:var(--muted);font-size:14px"> &middot; ' +
        esc(role === "remember" ? "who keeps it on their radar" : role === "do" ? "who physically does it" : "who steps in when life goes sideways") +
        '</span></div>' + peopleBtns(key, r[key]) + '</div>';
    }).join("") +
    '<div class="gap-s"></div>' +
    (r.remember === "me" ? '<button class="btn" id="respHand">Hand this over &rarr;</button><div class="gap-s" style="height:10px"></div>' : "") +
    '<button class="btn ghost sm" id="respDone">Done</button>'
  );
  wirePeople(r);
  var h = $("respHand"); if(h) h.onclick = function(){ openHandover(r.id); };
  $("respDone").onclick = function(){ closeSheet(); renderOwns(); };

  function peopleBtns(key, val){
    var ps = activePeople().filter(function(p){ return !p.provider; });
    return '<div class="people" data-key="' + key + '">' +
      ps.map(function(p){

var WILL_OWN = {
  "Daycare supplies":["noticing when supplies are running low","checking what daycare has asked for","replacing them before you get the note"],
  "Packing the daycare bag":["knowing what needs to be in it","checking it the night before","noticing when something's missing"],
  "Morning drop-off":["knowing what time drop-off is","having the bag ready","telling daycare about anything they need to know"],
  "Afternoon pickup":["knowing what time pickup is","being there","reading whatever daycare sends home"],
  "Groceries":["noticing what's running out","deciding when to shop","actually doing it"],
  "Car seat logistics":["knowing which car it's in","moving it when plans change","telling whoever's collecting"]
};
function willOwn(title){
  return WILL_OWN[title] || ["noticing when it needs doing","deciding when to do it","following it through"];
}

function openHandover(id){
  var r = S.resp.filter(function(x){ return x.id === id; })[0]; if(!r) return;
  var target = (r.doer && r.doer !== "me") ? r.doer : "victor";
  draw();

  function draw(){
    var who = pname(target);
    openSheet(
      '<p class="lab">Hand it over</p><div class="gap-s" style="height:10px"></div>' +
      '<h2 class="disp d2">' + nl(t("hand.title", { what:r.title.toLowerCase(), who:who })) + '</h2>' +
      '<div class="gap"></div>' +
      '<p class="lab">' + esc(t("hand.willOwn", { who:who })) + '</p>' +
      '<div class="gap-s" style="height:10px"></div>' +
      '<ul style="display:grid;gap:10px">' + willOwn(r.title).map(function(x){
        return '<li style="display:flex;gap:11px;font-size:16px;font-weight:600;line-height:1.35">' +
          '<span style="width:11px;height:2.5px;background:var(--coral);margin-top:11px;flex:none"></span>' + esc(x) + '</li>';
      }).join("") + '</ul>' +
      '<div class="gap"></div>' +
      '<p class="lab">Hand it to</p><div class="gap-s" style="height:10px"></div>' +
      '<div class="people" id="handWho">' + activePeople().filter(function(p){ return !p.provider && !p.isMe; }).map(function(p){
        return '<button class="pbtn" data-p="' + p.id + '" aria-pressed="' + (target === p.id) + '">' +
          '<span class="av" style="background:var(' + p.color + ')">' + p.initial + '</span>' + esc(p.name) + '</button>';
      }).join("") + '</div>' +
      '<div class="gap"></div>' +
      '<p class="sub" style="font-style:normal;font-size:15.5px;font-weight:600;color:var(--ink)">' + esc(t("hand.kicker")) + '</p>' +
      '<div class="gap-s"></div>' +
      '<button class="btn" id="handGo">' + esc(t("hand.cta")) + '</button>' +
      '<div style="text-align:center"><button class="txtbtn mut" id="handNo">Not yet</button></div>'
    );

      b.onclick = function(){ target = b.getAttribute("data-p"); draw(); };
    });

    $("handGo").onclick = function(){
      r.remember = target; r.doer = target; r.moved = true;
      if(r.backup === target) r.backup = "me";
      S.handedOver++; save(); closeSheet(); handDone(r, target);
    };
  }
}

function handDone(r, target){
  var who = pname(target);
  openTake(
    '<div class="mid">' +
      '<h2 class="disp d1">' + esc(t("hand.done")) + '</h2>' +

/* ==========================================================================
   SCREEN: MY WEEK
   ========================================================================== */
function renderWeek(){
  var el = $("s-week");
  var m = weekMonday();
  var tk = todayKey();

  var changes = S.exc.length ?
    '<div class="chg-list">' +
      '<p class="lab" style="margin-bottom:6px">' + esc(t("week.changes")) + '</p>' +
      S.exc.map(function(e){
        var dn = DAYS.filter(function(d){ return d.k === e.day; })[0];
        return '<div class="ci"><span class="cd">' + esc(dn ? dn.n.slice(0,3) : "") + '</span><span>' +
          esc(e.label) + (e.note ? ' <span style="color:var(--muted);font-weight:500">&middot; ' + esc(e.note) + '</span>' : '') +
          '</span></div>';
      }).join("") +
    '</div>' : '';

  el.innerHTML =
    '<div class="top"><p class="lab">Week of ' + esc(shortDate(m)) + '</p></div>' +
    '<div class="gap-s" style="height:14px"></div>' +
    '<h1 class="disp d1">' + esc(t("week.title")) + '</h1>' +
    '<div class="gap"></div>' + changes +
    (changes ? '<div class="gap-s"></div>' : '') +
    DAYS.map(function(d){ return dayBlock(d, d.k === tk); }).join("") +
    '<div class="gap"></div>' +
    '<div class="btn-row">' +
      '<button class="btn ghost sm" data-go2="reset">Sort my week</button>' +
      '<button class="btn ghost sm" data-go2="share">Share it</button>' +
    '</div>' +
    '<div class="gap-s"></div>' +
    '<p class="sub" style="font-size:14px">This is your normal week. It stays until you change it.</p>';

  function dayBlock(d, isToday){
    var r = routine()[d.k];
    var exc = S.exc.filter(function(e){ return e.day === d.k; });
    var pick = r.pick, changed = false;
    exc.forEach(function(e){ if(e.person){ pick = e.person; changed = true; } });
    var working = activePeople().filter(function(p){ return !p.provider && r.work[p.id]; });
    /* A day with no work and no childcare has no logistics to show. Three
       columns of "Not set" is noise, not information. */
    var hasDay = working.length || r.care;
    return '<div class="day' + (isToday ? " today" : "") + '" data-day="' + esc(d.k) + '" role="button" tabindex="0">' +
      '<div class="dh"><span class="dn">' + esc(d.n) + '</span>' +
        '<span class="dd">' + esc(shortDate(dateFor(d.k))) + (isToday ? " &middot; today" : "") +
        ' <span class="edit" aria-hidden="true">Edit</span></span></div>' +
      (hasDay
        ? '<div class="who">' +
            working.map(function(p){ return w(p.full, r.work[p.id][0], r.work[p.id][1]); }).join("") +
            (r.care ? w(childName(), r.care[0], r.care[1]) : "") +
          '</div>' +
          '<div class="logi">' +
            l("Drop-off", pname(r.drop), false) +
            l("Pickup", pname(pick), changed) +
            l("Dinner", pname(r.dinner), false) +
          '</div>'
        : '<p class="sub" style="font-size:14.5px">Nothing scheduled.</p>') +
      (exc.length ? '<div style="margin-top:11px;font-size:13.5px;font-weight:600;color:var(--coral-ink)">' +
        exc.map(function(e){ return esc(e.label); }).join(" &middot; ") + '</div>' : '') +
    '</div>';
    function w(who, what, when){
      return '<div class="w"><b>' + esc(who) + '</b><span>' + esc(what) +
        (when ? ' <small>&middot; ' + esc(when) + '</small>' : '') + '</span></div>';
    }
    function l(label, val, chg){
      return '<div class="l"><div class="ll">' + esc(label) + '</div><div class="lv' + (chg ? " chg" : "") + '">' +
        esc(val) + '</div></div>';
    }
  }

  Array.prototype.forEach.call(el.querySelectorAll("[data-day]"), function(node){
    function open(){ editDay(node.getAttribute("data-day")); }
    node.onclick = open;
    node.onkeydown = function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); }
    };
  });
}

/* The normal week, set once and changed only when real life changes. */
function editDay(k){
  var d = DAYS.filter(function(x){ return x.k === k; })[0];
  var r = routine()[k];
  var mine = activePeople().filter(function(p){ return !p.provider; });
  var carers = activePeople();

  draw();

  function draw(){
    openSheet(
      '<p class="lab">Your normal ' + esc(d.n.toLowerCase()) + '</p>' +
      '<div class="gap-s" style="height:10px"></div>' +
      '<h2 class="disp d2">' + esc(d.n) + '</h2>' +
      '<div class="gap-s" style="height:8px"></div>' +
      '<p class="sub" style="font-size:14px">Set it once. After this the app only asks what is different.</p>' +
      '<div class="gap-s"></div>' +

      '<div class="qa"><div class="q">Are you working?</div>' +
        '<div class="segs" id="edWork">' +
          ["off","office","home","flex"].map(function(m){
            var on = m === "off" ? !r.work.me : (r.work.me && modeKey(r.work.me[0]) === m);
            return '<button data-m="' + m + '" aria-pressed="' + !!on + '">' +
              (m === "off" ? "Off" : m === "flex" ? "Flexible" : m.charAt(0).toUpperCase() + m.slice(1)) +
              '</button>';
          }).join("") +
        '</div>' +
        (r.work.me ? '<div class="gap-s" style="height:10px"></div>' +
          '<input class="inp" id="edHours" value="' + esc(r.work.me[1] || "") + '" placeholder="Hours, e.g. 9–5">' : '') +
      '</div>' +

      '<div class="qa"><div class="q">Where is ' + esc(childName() || "your child") + '?</div>' +
        '<div class="people" id="edCare">' +
          '<button class="pbtn" data-c="" aria-pressed="' + !r.care + '">With us</button>' +
          carers.map(function(p){
            return '<button class="pbtn" data-c="' + p.id + '" aria-pressed="' +
              (!!r.care && r.care[0] === p.full) + '">' +
              '<span class="av" style="background:var(' + p.color + ')">' + esc(p.initial) + '</span>' +
              esc(p.full) + '</button>';
          }).join("") +
        '</div>' +
        (r.care ? '<div class="gap-s" style="height:10px"></div>' +
          '<input class="inp" id="edCareHours" value="' + esc(r.care[1] || "") + '" placeholder="Hours, e.g. 8–5:30">' : '') +
      '</div>' +

      slot("Drop-off", "drop", r.drop) +
      slot("Pickup", "pick", r.pick) +
      slot("Dinner", "dinner", r.dinner) +

      '<div class="gap-s"></div>' +
      '<button class="btn" id="edDone">Save this day</button>'
    );

    Array.prototype.forEach.call($("edWork").querySelectorAll("button"), function(b){
      b.onclick = function(){
        var m = b.getAttribute("data-m");
        if(m === "off") delete r.work.me;
        else r.work.me = [m === "flex" ? "Flexible" : m.charAt(0).toUpperCase() + m.slice(1),
                          r.work.me ? r.work.me[1] : ""];
        save(); draw();
      };
    });
    Array.prototype.forEach.call($("edCare").querySelectorAll("[data-c]"), function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-c");
        if(!id) r.care = null;
        else r.care = [pfull(id), r.care ? r.care[1] : ""];
        save(); draw();
      };
    });
    Array.prototype.forEach.call($("sheet").querySelectorAll(".people[data-slot]"), function(grp){
      var key = grp.getAttribute("data-slot");
      Array.prototype.forEach.call(grp.querySelectorAll(".pbtn"), function(b){
        b.onclick = function(){
          r[key] = b.getAttribute("data-p") || null; save(); draw();
        };
      });
    });
    $("edDone").onclick = function(){
      var h = $("edHours"); if(h && r.work.me) r.work.me[1] = h.value.trim();
      var c = $("edCareHours"); if(c && r.care) r.care[1] = c.value.trim();
      save(); closeSheet(); renderWeek(); toast(d.n + " saved.");
    };
  }

  function modeKey(label){
    var m = String(label).toLowerCase();
    return m === "flexible" ? "flex" : m;
  }
  function slot(label, key, val){
    return '<div class="qa"><div class="q">' + esc(label) + '</div>' +
      '<div class="people" data-slot="' + key + '">' +
      mine.map(function(p){
        return '<button class="pbtn" data-p="' + p.id + '" aria-pressed="' + (val === p.id) + '">' +
          '<span class="av" style="background:var(' + p.color + ')">' + esc(p.initial) + '</span>' +
          esc(p.name) + '</button>';
      }).join("") +
      '<button class="pbtn" data-p="" aria-pressed="' + !val + '">Nobody</button></div></div>';
  }
}

/* ---- the shareable card, drawn on a canvas ----
   Two passes over the same layout code: the first measures, the second paints.
   No external library, no backend. Always drawn in the light palette, because
   a dark card looks wrong dropped into a message thread. */
function paintCard(ctx, W, dry){
  /* Light palette, always: a dark card looks wrong in a message thread.
     ACC is the text-safe coral, not the brand fill. */
  var INK="#302B33", MUT="#736C77", LINE="#EADFD3", ACC="#C93A2B", BG="#FFF8F1";
  var pad=80, colW=170, cx=pad+colW, textW=W-cx-pad, y=0;

  function font(f){ ctx.font=f; }
  function ls(v){ try{ ctx.letterSpacing = v; }catch(e){} }
  function fill(c){ ctx.fillStyle=c; }
  function text(s,x,yy){ if(!dry) ctx.fillText(s,x,yy); }
  function rule(yy,h,c){ if(!dry){ ctx.fillStyle=c; ctx.fillRect(pad,yy,W-pad*2,h); } }
  function wrap(s,maxW){
    var words=String(s).split(" "), lines=[], line="";
    for(var i=0;i<words.length;i++){
      var trial = line ? line+" "+words[i] : words[i];
      if(ctx.measureText(trial).width > maxW && line){ lines.push(line); line=words[i]; }
      else line=trial;
    }
    if(line) lines.push(line);
    return lines;
  }
  function para(s,x,maxW,lh){
    wrap(s,maxW).forEach(function(l){ text(l,x,y); y+=lh; });
  }

  if(!dry){ ctx.fillStyle=BG; ctx.fillRect(0,0,W,ctx.canvas.height); }
  ctx.textBaseline="alphabetic";

  y = pad + 96;
  font('800 96px "Bricolage Grotesque", Georgia, serif'); ls("-4px"); fill(INK);
  text(t("share.title").toUpperCase(), pad, y);
  y += 44;
  font('700 26px Archivo, Helvetica, Arial, sans-serif'); ls("4px"); fill(MUT);
  text(("Week of " + shortDate(weekMonday())).toUpperCase(), pad, y);
  ls("0px");
  y += 34; rule(y,6,INK); y += 54;

  DAYS.forEach(function(d){
    var r=routine()[d.k];
    var exc=S.exc.filter(function(e){ return e.day===d.k; });
    var pick=r.pick; exc.forEach(function(e){ if(e.person) pick=e.person; });
    var top=y;

    font('700 27px Archivo, Helvetica, Arial, sans-serif'); ls("4px"); fill(MUT);
    text(d.n.slice(0,3).toUpperCase(), pad, y+34); ls("0px");

    y += 36;
    font('600 38px Archivo, Helvetica, Arial, sans-serif'); fill(INK);
    para(careLabel(r) + (careHours(r) ? "  " + careHours(r) : ""), cx, textW, 46);
    y += 6;
    font('500 32px Archivo, Helvetica, Arial, sans-serif'); fill(MUT);
    para(sname(r.drop) + " drop-off   ·   " + sname(pick) + " pickup", cx, textW, 42);
    if(exc.length){
      y += 4;
      font('600 30px Archivo, Helvetica, Arial, sans-serif'); fill(ACC);
      exc.forEach(function(e){ para(e.label, cx, textW, 40); });
    }
    y = Math.max(y, top+96) + 26;
    rule(y,2,LINE); y += 30;
  });

  function block(title, rows){
    if(!rows.length) return;
    y += 26;
    font('700 26px Archivo, Helvetica, Arial, sans-serif'); ls("4px"); fill(MUT);
    text(title.toUpperCase(), pad, y); ls("0px");
    y += 18; rule(y,3,INK); y += 46;
    rows.forEach(function(row){
      font('600 34px Archivo, Helvetica, Arial, sans-serif'); fill(INK);
      para(row[0], pad, W-pad*2, 44);
      if(row[1]){
        y += 2;
        font('500 30px Archivo, Helvetica, Arial, sans-serif'); fill(MUT);
        para(row[1], pad, W-pad*2, 40);
      }
      y += 18;
    });
  }

  block(t("week.changes"), S.exc.map(function(e){
    var dn=DAYS.filter(function(d){ return d.k===e.day; })[0];
    return [(dn?dn.n:"") + ": " + e.label, e.note || ""];
  }));

  block("If it goes wrong", S.scen.filter(function(s){ return s.ready && s.plan; }).map(function(s){
    return [s.title + ": " + sname(s.plan.first) + " first" +
            (s.plan.second ? ", then " + sname(s.plan.second) : ""), s.plan.note || ""];
  }));

  y += 30; rule(y,2,LINE); y += 44;
  font('600 26px Archivo, Helvetica, Arial, sans-serif'); fill(MUT);
  text("No app needed to read this.", pad, y);
  y += pad;
  return y;
}

function renderShareImage(){
  var W = 1080;
  return (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
    .then(function(){
      var m = document.createElement("canvas");
      m.width = W; m.height = 10;
      var H = Math.ceil(paintCard(m.getContext("2d"), W, true));

      var c = document.createElement("canvas");
      c.width = W; c.height = H;
      paintCard(c.getContext("2d"), W, false);

      return new Promise(function(res, rej){
        c.toBlob(function(b){ b ? res(b) : rej(new Error("no blob")); }, "image/png");
      });
    });
}

    lines.push("");
  });
  if(S.exc.length){
    lines.push("THIS WEEK'S CHANGES");
    S.exc.forEach(function(e){
      var dn = DAYS.filter(function(d){ return d.k === e.day; })[0];
      lines.push("  " + (dn ? dn.n : "") + ": " + e.label + (e.note ? " (" + e.note + ")" : ""));
    });
    lines.push("");
  }
  var ready = S.scen.filter(function(s){ return s.ready && s.plan; });
  if(ready.length){
    lines.push("IF IT GOES WRONG");
    ready.forEach(function(s){
      lines.push("  " + s.title + ": " + sname(s.plan.first) + " first" +
        (s.plan.second ? ", then " + sname(s.plan.second) : ""));
      if(s.plan.note) lines.push("    " + s.plan.note);
    });
  }
  return lines.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

  var pending = renderShareImage().then(function(b){ return sharePng = b; },
                                        function(){ return sharePng = null; });

  $("shGo").onclick = function(){
    var btn = $("shGo");

  function sendCard(){
    var file = null;
    if(sharePng && window.File){
      try{ file = new File([sharePng], "our-week.png", { type:"image/png" }); }catch(e){}
    }
    if(file && navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file], title:t("share.title") })
        .catch(function(err){ if(!err || err.name !== "AbortError") showCard(); });
      return;
    }
    if(navigator.share){
      navigator.share({ title:t("share.title"), text:shareText() })
        .catch(function(err){ if(!err || err.name !== "AbortError") showCard(); });
      return;
    }
    showCard();
  }

  /* Where the native sheet is unavailable: show the card so it can be
     long-pressed and saved, which is how phones actually keep an image. */
  function showCard(){
    if(!sharePng){ openExport(); return; }
    var url = URL.createObjectURL(sharePng);
    openSheet(
      '<h2 class="disp d3">Your week, as a picture</h2>' +
      '<div class="gap-s" style="height:10px"></div>' +

      '<div class="gap-s"></div>' +
      '<button class="btn ghost sm" id="cardMore">' + esc(t("share.other")) + '</button>'
    );
    $("cardMore").onclick = openExport;
    setTimeout(function(){ URL.revokeObjectURL(url); }, 120000);
  }

  function openExport(){
    openSheet(
      '<h2 class="disp d3">Other ways<br>to send it</h2>' +
      '<div class="gap-s"></div>' +
      '<div class="optlist" id="expOpts">' +
        '<button data-x="img"><span class="rd"><i></i></span>See it as a picture</button>' +
        '<button data-x="copy"><span class="rd"><i></i></span>Copy as text</button>' +
        '<button data-x="print"><span class="rd"><i></i></span>Print or save as PDF</button>' +
      '</div>'
    );
    Array.prototype.forEach.call($("expOpts").querySelectorAll("button"), function(b){
      b.onclick = function(){
        var x = b.getAttribute("data-x");
        if(x === "print"){ closeSheet(); setTimeout(function(){ window.print(); }, 260); }
        if(x === "img"){ showCard(); }
        if(x === "copy"){ copy(shareText()); }
      };
    });
  }

  function copy(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ closeSheet(); toast("Copied. Paste it anywhere."); },
        function(){ fallback(txt); });
    } else fallback(txt);
  }
  function fallback(txt){
    openSheet('<h2 class="disp d3">Copy this</h2><div class="gap-s"></div>' +
      '<textarea class="inp" rows="14" readonly data-autofocus>' + esc(txt) + '</textarea>');
  }
}

/* Removing someone has to clear every reference to them, or the week starts
   pointing at a person who no longer exists. */
function forgetPerson(id){
  Object.keys(routine()).forEach(function(k){
    var r = routine()[k];
    ["drop","pick","dinner"].forEach(function(f){ if(r[f] === id) r[f] = null; });
    if(r.work && r.work[id]) delete r.work[id];
    if(r.care && r.care[0] === pfull(id)) r.care = null;
  });
  S.resp.forEach(function(x){
    if(x.remember === id) x.remember = "me";
    if(x.doer === id) x.doer = null;
    if(x.backup === id) x.backup = null;
  });
  S.scen.forEach(function(x){
    if(!x.plan) return;
    ["first","second","third"].forEach(function(f){ if(x.plan[f] === id) x.plan[f] = null; });
    if(!x.plan.first) x.ready = false;
  });
  S.exc.forEach(function(e){ if(e.person === id){ e.person = null; e.needsCover = true; } });
  S.people = S.people.filter(function(p){ return p.id !== id; });
}

function editPerson(id){
  var p = id ? person(id) : null;
  openSheet(
    '<h2 class="disp d3">' + (p ? esc(p.full) : "Who else is<br>in the operation?") + '</h2>' +
    '<div class="gap-s" style="height:10px"></div>' +
    (p && p.isMe ? '<p class="sub">This is you. Everything is addressed to this name.</p>'
                 : '<p class="sub">Anyone who can own something, do something, or step in.</p>') +
    '<div class="gap-s"></div>' +
    '<div class="field"><label class="lab" for="pName">Name</label>' +
      '<input class="inp" id="pName" data-autofocus value="' + esc(p ? p.full : "") + '" placeholder="Their name"></div>' +
    (p || true ? '<div class="field"><label class="lab">They are</label>' +
      '<div class="segs" id="pKind">' +
        '<button data-k="person" aria-pressed="' + (!p || !p.provider) + '">A person</button>' +
        '<button data-k="provider" aria-pressed="' + (!!p && !!p.provider) + '">Childcare</button>' +
      '</div></div>' : '') +
    '<button class="btn" id="pGo">Save</button>' +
    (p && !p.isMe ? '<div style="text-align:center">' +
      '<button class="txtbtn mut" id="pDel">Remove ' + esc(p.full) + '</button></div>' : '')
  );

  var kind = p && p.provider ? "provider" : "person";
  Array.prototype.forEach.call($("pKind").querySelectorAll("button"), function(b){
    b.onclick = function(){
      kind = b.getAttribute("data-k");
      Array.prototype.forEach.call($("pKind").querySelectorAll("button"), function(o){
        o.setAttribute("aria-pressed", String(o === b));
      });
    };
  });

  $("pGo").onclick = function(){
    var v = $("pName").value.trim();
    if(!v){ $("pName").focus(); return; }
    if(p){
      p.full = v;
      p.name = p.isMe ? "You" : v;
      p.initial = v.charAt(0).toUpperCase();
      if(!p.isMe) p.provider = kind === "provider";
    } else {
      S.people.push(makePerson(v, { provider: kind === "provider" }));
    }
    save(); closeSheet(); renderMore(); toast("Saved.");
  };

  var del = $("pDel");
  if(del) del.onclick = function(){
    openSheet(
      '<h2 class="disp d3">Remove ' + esc(p.full) + '?</h2>' +
      '<div class="gap-s"></div>' +
      '<p class="sub">Anything they were doing or backing up becomes unassigned, ' +
        'and anything they were remembering comes back to you.</p>' +
      '<div class="gap-s"></div>' +
      '<button class="btn" id="pDelGo">Remove them</button>' +
      '<div style="text-align:center"><button class="txtbtn mut" id="pDelNo">Keep them</button></div>'
    );
    $("pDelNo").onclick = closeSheet;
    $("pDelGo").onclick = function(){
      forgetPerson(p.id); save(); closeSheet(); renderMore();
      toast(p.full + " removed.");
    };
  };
}

      b.onclick = function(){
        var c = b.getAttribute("data-c"), i = o.care.indexOf(c);
        if(i >= 0) o.care.splice(i,1); else o.care.push(c);
        save(); renderOb(4);
      };
    });
    function addPerson(){
      var v = $("obNew").value.trim();
      if(v && o.extra.indexOf(v) < 0){ o.extra.push(v); save(); renderOb(4); }
    }
    $("obNew").addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); addPerson(); }
    });
    $("obNew").addEventListener("blur", addPerson);
    var pl = $("obPeople");
    if(pl) Array.prototype.forEach.call(pl.querySelectorAll("[data-i]"), function(b){
      b.onclick = function(){
        o.extra.splice(parseInt(b.getAttribute("data-i"), 10), 1); save(); renderOb(4);
      };
    });
  }

  if(step === 5){
    var stucks = [
      ["prep","Everything I need to sort before work"],
      ["owns","Who's doing what"],
      ["week","Our weekly logistics"],
      ["chaos","What happens when something goes wrong"],
      ["all","Honestly? All of it."]
    ];
    el.innerHTML = shell(4,
      '<h1 class="disp d2">' + nl(t("ob.5.title")) + '</h1>' +
      '<div class="gap-s"></div><p class="sub">' + esc(t("ob.5.why")) + '</p>' +
      '<div class="gap"></div>' +
      '<div class="optlist" id="obStuck">' + stucks.map(function(s){
        return '<button data-s="' + s[0] + '" aria-pressed="' + (o.stuck === s[0]) + '">' +
          '<span class="rd"><i></i></span>' + esc(s[1]) + '</button>';
      }).join("") + '</div>',
      '<button class="btn" data-ob="done"' + (o.stuck ? "" : " disabled") + '>Take me there &rarr;</button>');
    Array.prototype.forEach.call($("obStuck").querySelectorAll("[data-s]"), function(b){
      b.onclick = function(){ o.stuck = b.getAttribute("data-s"); save(); renderOb(5); };
    });
  }

  Array.prototype.forEach.call(el.querySelectorAll("[data-ob]"), function(b){
    b.onclick = function(){
      var n = b.getAttribute("data-ob");
      if(n === "done") finishOb(); else renderOb(parseInt(n,10));
    };
  });
  var sk = el.querySelector("[data-skip]");
  if(sk) sk.onclick = function(){ renderOb(parseInt(sk.getAttribute("data-skip"),10)); };

  function shell(idx, mid, foot, hideSkip){
    return '<div class="ob"><div class="obtop">' +
      (idx > 0 ? '<button class="txtbtn mut" data-ob="' + idx + '" style="padding:0">&larr;</button>' : '<span></span>') +
      '<span class="prog">' + [0,1,2,3,4].map(function(i){
        return '<i class="' + (i <= idx ? "on" : "") + '"></i>'; }).join("") + '</span>' +
      '</div><div class="obmid">' + mid + '</div><div class="obfoot">' + foot +
      (hideSkip || idx === 4 ? '' :
        '<div style="text-align:center"><button class="txtbtn mut" data-skip="' + (idx + 2) + '">Skip, I\'ll do this later</button></div>') +
      '</div></div>';
  }
}

/* Turns the onboarding answers into the actual household and week. Everything
   asked for gets used here; nothing is collected and thrown away. */
function applyOnboarding(){
  var o = S.ob;

  S.child = { name: (o.childName || "").trim() };

  S.people = [ makePerson((o.myName || "You").trim(), { id:"me", isMe:true, color:"--coral" }) ];
  o.extra.forEach(function(nm, i){
    S.people.push(makePerson(nm, { color: PERSON_COLORS[i % PERSON_COLORS.length] }));
  });
  /* Childcare providers are people too, but they cannot own anything. */
  o.care.filter(function(c){ return c === "Daycare" || c === "Nanny"; }).forEach(function(c){
    S.people.push(makePerson(c, { color:"--line", provider:true }));
  });

  var careLabel = o.care.length ? o.care[0] : null;
  S.routine = blankRoutine();
  o.days.forEach(function(k){
    var mode = o.modes[k] || "office";
    S.routine[k].work = {};
    S.routine[k].work.me = [mode === "flex" ? "Flexible" : mode.charAt(0).toUpperCase() + mode.slice(1), ""];
    if(careLabel) S.routine[k].care = [careLabel, ""];
  });

  if(o.back === "already"){
    S.returnedAlready = true;
    S.returnStarted = new Date().toISOString().slice(0, 10);
  } else if(o.back){
    S.returnDate = o.back;
  }
}

function finishOb(){
  S.onboarded = true;
  var stuck = S.ob.stuck;
  applyOnboarding();
  save();
  openTake(
    '<div class="mid">' +
      '<h2 class="disp d1">' + nl(t("ob.done.title")) + '</h2>' +
      '<div class="gap-s" style="height:14px"></div>' +
      '<p style="font-size:18px;font-weight:600;max-width:26ch;line-height:1.4;opacity:.85">' + esc(t("ob.done.body")) + '</p>' +
    '</div>' +
    '<button class="btn" id="obGo">' +
      esc(stuck === "prep" ? "Show me what to sort" : stuck === "owns" ? "Show me who owns what" :
          stuck === "week" ? "Show me my week" : stuck === "chaos" ? "Show me the backup plans" : "Start with today") +
      ' &rarr;</button>', "");
  $("obGo").onclick = function(){
    closeTake();
    var dest = { prep:"return", owns:"owns", week:"week", chaos:"chaos", all:"today" }[stuck] || "today";
    go(dest);
    if(dest === "owns" && !S.revealSeen) setTimeout(showReveal, 500);
  };
}

/* ==========================================================================
   THEME
   ========================================================================== */
function setTheme(v){
  S.theme = v; save();
  if(v === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", v);
}

/* ==========================================================================
   BOOT
   ========================================================================== */
setTheme(S.theme);

$("fab").onclick = openCapture;
Array.prototype.forEach.call($("nav").querySelectorAll("[data-go]"), function(b){
  b.onclick = function(){
    var d = b.getAttribute("data-go");
    if(d === "owns" && !S.revealSeen && onMe().length >= 10){ showReveal(); return; }
    go(d);
  };
});

document.addEventListener("click", function(e){
  var g = e.target.closest ? e.target.closest("[data-go2]") : null;
  if(g){ e.preventDefault(); closeSheet(); go(g.getAttribute("data-go2")); return; }
  var u = e.target.closest ? e.target.closest("[data-un]") : null;
  if(u){
    e.preventDefault();
    var pin = u.getAttribute("data-pin");
    if(pin){
      var d = S.dumps.filter(function(x){ return x.id === pin; })[0];
      if(d){ d.pinned = false; save(); toast("Cleared."); renderToday(); }
      return;
    }
    var dest = u.getAttribute("data-un"), sc = u.getAttribute("data-scen");
    go(dest, sc ? { scen:sc } : null);
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if($("takeover").classList.contains("on")) closeTake();
    else if($("sheet").classList.contains("on")) closeSheet();
  }
});

go(S.onboarded ? (screenFromHash() || "today") : "onboard");

window.addEventListener("hashchange", function(){
  var s = screenFromHash();
  if(s && s !== current) go(s);
});

if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0 && DEPLOYED){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
})();
</script>
</body>
